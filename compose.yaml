name: dgx-ai-pilot

services:
  vllm-embeddings:
    build:
      context: .
      dockerfile: containers/vllm.Dockerfile
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai}
        VLLM_VERSION: ${VLLM_VERSION:?Defineix VLLM_VERSION en el fitxer .env}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-vllm:${VLLM_VERSION:-latest}-arm64
    platform: linux/arm64
    container_name: dgx-vllm-embeddings
    restart: unless-stopped
    init: true
    gpus: all
    command:
      - --model=${VLLM_EMBEDDINGS_MODEL:-BAAI/bge-m3}
      - --served-model-name=bge-m3
      - --port=8000
      - --api-key=${VLLM_EMBEDDINGS_API_KEY:?Defineix VLLM_EMBEDDINGS_API_KEY en el fitxer .env}
      - --gpu-memory-utilization=${VLLM_EMBEDDINGS_GPU_MEM_UTIL:-0.10}
      - --max-model-len=${VLLM_EMBEDDINGS_MAX_MODEL_LEN:-8192}
      # Un model d'embeddings és tan xicotet que la compilació CUDA-graph
      # (torch.compile) triga més que no estalvia; --enforce-eager fa que
      # arranque en segons en lloc de quedar-se molts minuts compilant.
      - --enforce-eager
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - vllm_embeddings_cache:/home/vllm
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    pids_limit: 1024
    cpus: ${VLLM_EMBEDDINGS_CPUS:-4}
    mem_limit: ${VLLM_EMBEDDINGS_MEMORY_LIMIT:-16g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  vllm-reasoning:
    build:
      context: .
      dockerfile: containers/vllm.Dockerfile
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai}
        VLLM_VERSION: ${VLLM_VERSION:?Defineix VLLM_VERSION en el fitxer .env}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-vllm:${VLLM_VERSION:-latest}-arm64
    platform: linux/arm64
    container_name: dgx-vllm-reasoning
    restart: unless-stopped
    init: true
    gpus: all
    command:
      - --model=${VLLM_REASONING_MODEL:-openai/gpt-oss-120b}
      - --served-model-name=gpt-oss-120b
      - --port=8000
      - --api-key=${VLLM_REASONING_API_KEY:?Defineix VLLM_REASONING_API_KEY en el fitxer .env}
      - --gpu-memory-utilization=${VLLM_REASONING_GPU_MEM_UTIL:-0.65}
      - --max-model-len=${VLLM_REASONING_MAX_MODEL_LEN:-32768}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      # gpt-oss usa el format "harmony" d'OpenAI, que el propi paquet
      # openai_harmony (client Rust) intenta baixar en arrancar des de
      # openaipublic.blob.core.windows.net — i eixe client falla en molts
      # entorns (problema conegut, també reportat als playbooks de DGX
      # Spark) encara que la xarxa funcione bé per altres vies. Es
      # pre-descarrega el fitxer amb el nom hash (SHA1 de la URL) que
      # espera la seua caché, dins del volum persistent, per no dependre
      # d'eixe client en cada arrancada.
      TIKTOKEN_RS_CACHE_DIR: /home/vllm/.cache/tiktoken-rs-cache
    volumes:
      - vllm_reasoning_cache:/home/vllm
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4g,mode=1777
    pids_limit: 1024
    cpus: ${VLLM_REASONING_CPUS:-12}
    mem_limit: ${VLLM_REASONING_MEMORY_LIMIT:-100g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      # Un model de 120B pot trigar molts minuts a descarregar-se i carregar-se
      # la primera vegada. Ajusta si el healthcheck marca "unhealthy" massa prompte.
      start_period: 900s

  # Model de programació / ús general (Nemotron, Qwen2.5-Coder...). Opcional:
  # només arranca amb `docker compose --profile coding up -d`. Comparteix GPU
  # amb vllm-reasoning: comprova que la suma de VLLM_*_GPU_MEM_UTIL no supera
  # la memòria unificada disponible abans d'activar-lo alhora que el de raonament.
  vllm-coding:
    profiles:
      - coding
    build:
      context: .
      dockerfile: containers/vllm.Dockerfile
      args:
        VLLM_IMAGE: ${VLLM_IMAGE:-vllm/vllm-openai}
        VLLM_VERSION: ${VLLM_VERSION:?Defineix VLLM_VERSION en el fitxer .env}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-vllm:${VLLM_VERSION:-latest}-arm64
    platform: linux/arm64
    container_name: dgx-vllm-coding
    restart: unless-stopped
    init: true
    gpus: all
    command:
      - --model=${VLLM_CODING_MODEL:?Defineix VLLM_CODING_MODEL en el fitxer .env}
      - --served-model-name=coding-model
      - --port=8000
      - --api-key=${VLLM_CODING_API_KEY:?Defineix VLLM_CODING_API_KEY en el fitxer .env}
      - --gpu-memory-utilization=${VLLM_CODING_GPU_MEM_UTIL:-0.20}
      - --max-model-len=${VLLM_CODING_MAX_MODEL_LEN:-32768}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - vllm_coding_cache:/home/vllm
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=4g,mode=1777
    pids_limit: 1024
    cpus: ${VLLM_CODING_CPUS:-8}
    mem_limit: ${VLLM_CODING_MEMORY_LIMIT:-40g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  postgres:
    image: pgvector/pgvector:${POSTGRES_IMAGE_TAG:-pg16}
    platform: linux/arm64
    container_name: dgx-postgres
    restart: unless-stopped
    init: true
    environment:
      # Base i rol d'arrancada del clúster: Open WebUI (usuaris, xats, vectors).
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
      POSTGRES_USER: ${POSTGRES_USER:-openwebui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defineix POSTGRES_PASSWORD en el fitxer .env}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Base i rol propis de LiteLLM (claus, usuaris, pressupostos, logs).
      # Els crea postgres-init/02-create-litellm-db.sh en el primer arrancada.
      LITELLM_POSTGRES_DB: ${LITELLM_POSTGRES_DB:-litellm}
      LITELLM_POSTGRES_USER: ${LITELLM_POSTGRES_USER:-litellm}
      LITELLM_POSTGRES_PASSWORD: ${LITELLM_POSTGRES_PASSWORD:?Defineix LITELLM_POSTGRES_PASSWORD en el fitxer .env}
      # Rol i esquema propis de litellm-pgvector, DINS de la base 'openwebui'
      # reutilitzada — però amb privilegis només sobre eixe esquema, mai
      # sobre 'public'. Els crea postgres-init/03-create-litellm-pgvector-role.sh
      # en el primer arrancada. Vegeu la nota d'incident real en eixe fitxer.
      LITELLM_PGVECTOR_POSTGRES_USER: ${LITELLM_PGVECTOR_POSTGRES_USER:-litellm_pgvector}
      LITELLM_PGVECTOR_POSTGRES_PASSWORD: ${LITELLM_PGVECTOR_POSTGRES_PASSWORD:?Defineix LITELLM_PGVECTOR_POSTGRES_PASSWORD en el fitxer .env}
      LITELLM_PGVECTOR_SCHEMA: ${LITELLM_PGVECTOR_SCHEMA:-litellm_pgvector}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # S'executen només quan el volum de dades és nou.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # L'entrypoint oficial de Postgres arranca com a root per a fer
    # chown del volum de dades i després baixa privilegis a l'usuari
    # postgres. Calen estes capacitats mínimes per a eixa transició.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=64m,mode=1777
    shm_size: 256mb
    pids_limit: 256
    cpus: ${POSTGRES_CPUS:-4}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-8g}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-openwebui} -d $${POSTGRES_DB:-openwebui}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  tika:
    image: apache/tika:${TIKA_VERSION:-3.1.0.0-full}
    platform: linux/arm64
    container_name: dgx-tika
    restart: unless-stopped
    init: true
    environment:
      TIKA_JVM_OPTS: ${TIKA_JVM_OPTS:-"-Xmx3g -Xms512m"}
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    pids_limit: 256
    cpus: ${TIKA_CPUS:-4}
    mem_limit: ${TIKA_MEMORY_LIMIT:-4g}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://localhost:9998/tika"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Connector no oficial (BerriAI/litellm-pgvector) que exposa PostgreSQL+
  # pgvector com una Vector Store API OpenAI-compatible, perquè LiteLLM
  # l'usa com a "vector_store_registry" (/v1/vector_stores). Genera els
  # embeddings cridant de nou a LiteLLM (bge-m3 via vllm-embeddings) amb una
  # clau virtual pròpia, restringida a eixe model.
  litellm-pgvector:
    build:
      context: .
      dockerfile: containers/litellm-pgvector.Dockerfile
      args:
        LITELLM_PGVECTOR_REF: ${LITELLM_PGVECTOR_REF:-b553f84a32f580b4303297df5567f25912b59d93}
        EMBEDDING_DIMENSIONS: ${LITELLM_PGVECTOR_EMBEDDING_DIMENSIONS:-1024}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-litellm-pgvector:${LITELLM_PGVECTOR_REF:-b553f84a32f580b4303297df5567f25912b59d93}-arm64
    platform: linux/arm64
    container_name: dgx-litellm-pgvector
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Accés directe en loopback per a crear/gestionar magatzems de
      # vectors (scripts/litellm-register-vectorstore.sh), igual que la
      # resta de serveis administrables.
      - "127.0.0.1:${LITELLM_PGVECTOR_PORT:-8010}:8000"
    environment:
      # Reutilitza la base 'openwebui', que ja té l'extensió pgvector
      # activada (01-enable-vector.sql): no calen base nova. PERÒ es
      # connecta amb un rol PROPI (LITELLM_PGVECTOR_POSTGRES_USER, creat per
      # postgres-init/03-create-litellm-pgvector-role.sh), amb privilegis
      # només sobre el seu esquema (PG_SCHEMA) — mai amb el rol 'openwebui'
      # ni sobre 'public'. "prisma db push" introspecciona i reconcilia TOT
      # l'esquema on es connecta, esborrant qualsevol taula que no siga
      # seua: amb el rol 'openwebui' sobre 'public' ja va esborrar TOTES
      # les taules d'Open WebUI una vegada (vegeu la nota d'incident real a
      # containers/litellm-pgvector.Dockerfile i README.md). Amb este rol,
      # encara que ho intentara, Postgres li negaria el permís. No canviar
      # açò per conveniència.
      # Parts soltes (no DATABASE_URL ja construïda): el CMD de la imatge la
      # munta codificant PG_PASSWORD per URL, vegeu containers/litellm-pgvector.Dockerfile.
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${LITELLM_PGVECTOR_POSTGRES_USER:-litellm_pgvector}
      PG_PASSWORD: ${LITELLM_PGVECTOR_POSTGRES_PASSWORD}
      PG_DATABASE: ${POSTGRES_DB:-openwebui}
      PG_SCHEMA: ${LITELLM_PGVECTOR_SCHEMA:-litellm_pgvector}
      SERVER_API_KEY: ${LITELLM_PGVECTOR_SERVER_API_KEY:?Defineix LITELLM_PGVECTOR_SERVER_API_KEY en el fitxer .env}
      # "openai/" li diu al SDK de LiteLLM que use el client OpenAI-
      # compatible contra EMBEDDING__BASE_URL (el prefix es lleva abans
      # d'enviar la petició; sense ell falla amb "LLM Provider NOT provided").
      EMBEDDING__MODEL: openai/bge-m3
      EMBEDDING__BASE_URL: http://litellm:4000
      # Clau virtual de LiteLLM restringida al model bge-m3 (mai la mestra).
      # Es genera DESPRÉS d'alçar litellm, amb scripts/litellm-create-key.sh
      # (vegeu README.md).
      EMBEDDING__API_KEY: ${LITELLM_PGVECTOR_EMBEDDING_API_KEY:?Defineix LITELLM_PGVECTOR_EMBEDDING_API_KEY en el fitxer .env (clau virtual creada amb scripts/litellm-create-key.sh, restringida a bge-m3)}
      EMBEDDING__DIMENSIONS: ${LITELLM_PGVECTOR_EMBEDDING_DIMENSIONS:-1024}
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    pids_limit: 256
    cpus: ${LITELLM_PGVECTOR_CPUS:-2}
    mem_limit: ${LITELLM_PGVECTOR_MEMORY_LIMIT:-2g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  litellm:
    image: ghcr.io/berriai/litellm-database:${LITELLM_VERSION:-main-stable}
    platform: linux/arm64
    container_name: dgx-litellm
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      vllm-embeddings:
        condition: service_healthy
      vllm-reasoning:
        condition: service_healthy
    ports:
      # Accés directe en loopback per a administració/proves (claus, /ui),
      # igual que Ollama/Open WebUI abans. La publicació pública és via Caddy
      # en api.${LITELLM_HOSTNAME}.
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    command:
      - --config=/app/config.yaml
      - --port=4000
    environment:
      DATABASE_URL: postgresql://${LITELLM_POSTGRES_USER:-litellm}:${LITELLM_POSTGRES_PASSWORD}@postgres:5432/${LITELLM_POSTGRES_DB:-litellm}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Defineix LITELLM_MASTER_KEY en el fitxer .env}
      # Xifra les claus de proveïdor guardades en la base de dades. Fixa-la
      # sempre: si es regenera sola en cada arrancada, es perd l'accés a les
      # dades ja xifrades.
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Defineix LITELLM_SALT_KEY en el fitxer .env}
      VLLM_EMBEDDINGS_API_KEY: ${VLLM_EMBEDDINGS_API_KEY}
      VLLM_REASONING_API_KEY: ${VLLM_REASONING_API_KEY}
      VLLM_CODING_API_KEY: ${VLLM_CODING_API_KEY:-}
      # Clau del connector litellm-pgvector (vector_store_registry en
      # litellm/config.yaml). No hi ha dependència d'arrancada entre tots dos
      # (litellm-pgvector no necessita litellm fins a la primera petició real
      # d'embedding, i litellm no necessita litellm-pgvector per a arrancar):
      # evita el cicle amb LITELLM_PGVECTOR_EMBEDDING_API_KEY, que només es
      # pot generar DESPRÉS que litellm ja estiga en marxa.
      LITELLM_PGVECTOR_SERVER_API_KEY: ${LITELLM_PGVECTOR_SERVER_API_KEY:?Defineix LITELLM_PGVECTOR_SERVER_API_KEY en el fitxer .env}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777
    pids_limit: 512
    cpus: ${LITELLM_CPUS:-4}
    mem_limit: ${LITELLM_MEMORY_LIMIT:-4g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  open-webui:
    build:
      context: .
      dockerfile: containers/openwebui.Dockerfile
      args:
        OPEN_WEBUI_VERSION: ${OPEN_WEBUI_VERSION:-v0.11.0}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-openwebui:${OPEN_WEBUI_VERSION:-v0.11.0}-arm64
    platform: linux/arm64
    container_name: dgx-openwebui
    restart: unless-stopped
    init: true
    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      tika:
        condition: service_healthy
    ports:
      # La interfície es publica només en localhost. Caddy publica WEBUI_URL
      # amb HTTPS.
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      # Open WebUI és ara un client OpenAI-compatible més de LiteLLM: ja no
      # parla amb Ollama ni gestiona claus de proveïdor pròpies. La clau ha
      # de ser una clau VIRTUAL de LiteLLM (vegeu scripts/litellm-create-key.sh),
      # mai LITELLM_MASTER_KEY.
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URLS: http://litellm:4000/v1
      OPENAI_API_KEYS: ${OPENWEBUI_LITELLM_API_KEY:?Defineix OPENWEBUI_LITELLM_API_KEY en el fitxer .env (clau virtual creada amb scripts/litellm-create-key.sh)}

      # Usuaris, xats i base vectorial en el mateix PostgreSQL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}

      # Embeddings de la RAG (fitxers/coneixement pujats a Open WebUI) via
      # bge-m3 servit per vllm-embeddings, per LiteLLM. RAG_OPENAI_API_* són
      # variables PRÒPIES (no cauen sobre OPENAI_API_BASE_URLS/KEYS de dalt).
      RAG_EMBEDDING_ENGINE: openai
      RAG_EMBEDDING_MODEL: bge-m3
      RAG_OPENAI_API_BASE_URL: http://litellm:4000/v1
      RAG_OPENAI_API_KEY: ${OPENWEBUI_LITELLM_API_KEY:?Defineix OPENWEBUI_LITELLM_API_KEY en el fitxer .env (clau virtual creada amb scripts/litellm-create-key.sh)}

      # Extractor de contingut amb Apache Tika
      CONTENT_EXTRACTION_ENGINE: tika
      TIKA_SERVER_URL: http://tika:9998

      WEBUI_URL: ${WEBUI_URL:-https://spark-6169.cipfpbatoi.lan}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Defineix WEBUI_SECRET_KEY en el fitxer .env}
      WEBUI_AUTH: "true"
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Administrador IA}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: pending
      ENABLE_PASSWORD_VALIDATION: "true"
      PASSWORD_VALIDATION_REGEX_PATTERN: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{12,}$'
      PASSWORD_VALIDATION_HINT: "Mínim 12 caràcters amb majúscula, minúscula, número i símbol."
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      WEBUI_SESSION_COOKIE_SECURE: ${WEBUI_SESSION_COOKIE_SECURE:-true}
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      # Open WebUI separa els orígens amb ';', no amb ','. Sense orígens de
      # depuració per defecte: afig-los només en el .env local si cal
      # (vegeu CORS_ALLOW_ORIGIN en .env.example).
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-${WEBUI_URL:-https://spark-6169.cipfpbatoi.lan}}
      HSTS: max-age=31536000;includeSubDomains
      XFRAME_OPTIONS: DENY
      XCONTENT_TYPE: nosniff
      REFERRER_POLICY: strict-origin-when-cross-origin
      PERMISSIONS_POLICY: camera=(),microphone=(),geolocation=()
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_ADMIN_EXPORT: "false"
      BYPASS_MODEL_ACCESS_CONTROL: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"

      AIOHTTP_CLIENT_ALLOW_REDIRECTS: "false"
      HOME: /app/backend/data
      HF_HOME: /app/backend/data/cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/backend/data/cache/sentence-transformers
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    pids_limit: 512
    cpus: ${OPEN_WEBUI_CPUS:-4}
    mem_limit: ${OPEN_WEBUI_MEMORY_LIMIT:-8g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5));
          raise SystemExit(0 if data.get('status') is True else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2.11.4-alpine
    platform: linux/arm64
    container_name: dgx-caddy
    restart: unless-stopped
    init: true

    depends_on:
      open-webui:
        condition: service_healthy
      litellm:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - ai_backend

    security_opt:
      - no-new-privileges:true

networks:
  ai_backend:
    name: dgx_ai_backend
    driver: bridge

volumes:
  openwebui_data:
    name: dgx_openwebui_data
  postgres_data:
    name: dgx_postgres_data

  vllm_embeddings_cache:
    name: dgx_vllm_embeddings_cache
  vllm_reasoning_cache:
    name: dgx_vllm_reasoning_cache
  vllm_coding_cache:
    name: dgx_vllm_coding_cache

  caddy_data:
    name: dgx_caddy_data

  caddy_config:
    name: dgx_caddy_config
