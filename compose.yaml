name: dgx-ai-pilot

services:
  ollama:
    build:
      context: .
      dockerfile: containers/ollama.Dockerfile
      args:
        OLLAMA_VERSION: ${OLLAMA_VERSION:-0.31.1}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-ollama:${OLLAMA_VERSION:-0.31.1}-arm64
    platform: linux/arm64
    container_name: dgx-ollama
    restart: unless-stopped
    init: true
    gpus: all
    ports:
      # API directa d'Ollama només en el loopback de la DGX.
      # No és accessible des de la LAN i no incorpora autenticació.
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    environment:
      # Ha d'escoltar en totes les interfícies DINS del contenidor perquè
      # Open WebUI i la publicació Docker en localhost puguen connectar-se.
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /home/ollama/.ollama/models
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-32}
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-q8_0}
    volumes:
      - ollama_data:/home/ollama/.ollama
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    pids_limit: 1024
    cpus: ${OLLAMA_CPUS:-16}
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-100g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  postgres:
    image: pgvector/pgvector:${POSTGRES_IMAGE_TAG:-pg16}
    platform: linux/arm64
    container_name: dgx-postgres
    restart: unless-stopped
    init: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-openwebui}
      POSTGRES_USER: ${POSTGRES_USER:-openwebui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defineix POSTGRES_PASSWORD en el fitxer .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # S'executa només quan el volum de dades és nou.
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # L'entrypoint oficial de Postgres arranca com a root per a fer
    # chown del volum de dades i després baixa privilegis a l'usuari
    # postgres. Calen estes capacitats mínimes per a eixa transició.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=64m,mode=1777
    shm_size: 256mb
    pids_limit: 256
    cpus: ${POSTGRES_CPUS:-4}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-8g}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-openwebui} -d $${POSTGRES_DB:-openwebui}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  open-webui:
    build:
      context: .
      dockerfile: containers/openwebui.Dockerfile
      args:
        OPEN_WEBUI_VERSION: ${OPEN_WEBUI_VERSION:-v0.11.0}
        APP_UID: ${APP_UID:-10001}
        APP_GID: ${APP_GID:-10001}
    image: local/dgx-openwebui:${OPEN_WEBUI_VERSION:-v0.11.0}-arm64
    platform: linux/arm64
    container_name: dgx-openwebui
    restart: unless-stopped
    init: true
    depends_on:
      ollama:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      # La interfície i l'API es publiquen només en localhost.
      # El proxy invers o cloudflared publicarà WEBUI_URL amb HTTPS.
      - "127.0.0.1:${OPEN_WEBUI_PORT:-3000}:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434

      # Usuaris, xats i base vectorial en el mateix PostgreSQL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}
      VECTOR_DB: pgvector
      PGVECTOR_DB_URL: postgresql://${POSTGRES_USER:-openwebui}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-openwebui}

      WEBUI_URL: ${WEBUI_URL:-https://ia-professorat.cipfpbatoi.lan}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Defineix WEBUI_SECRET_KEY en el fitxer .env}
      WEBUI_AUTH: "true"
      WEBUI_ADMIN_NAME: ${WEBUI_ADMIN_NAME:-Administrador IA}
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-}
      ENABLE_SIGNUP: "false"
      DEFAULT_USER_ROLE: pending
      ENABLE_PASSWORD_VALIDATION: "true"
      PASSWORD_VALIDATION_REGEX_PATTERN: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^\w\s]).{12,}$'
      PASSWORD_VALIDATION_HINT: "Mínim 12 caràcters amb majúscula, minúscula, número i símbol."
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      WEBUI_SESSION_COOKIE_SECURE: ${WEBUI_SESSION_COOKIE_SECURE:-true}
      WEBUI_SESSION_COOKIE_SAME_SITE: strict
      # Open WebUI separa els orígens amb ';', no amb ','. Sense orígens de
      # depuració per defecte: afig-los només en el .env local si cal
      # (vegeu CORS_ALLOW_ORIGIN en .env.example).
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-${WEBUI_URL:-https://ia-professorat.cipfpbatoi.lan}}
      HSTS: max-age=31536000;includeSubDomains
      XFRAME_OPTIONS: DENY
      XCONTENT_TYPE: nosniff
      REFERRER_POLICY: strict-origin-when-cross-origin
      PERMISSIONS_POLICY: camera=(),microphone=(),geolocation=()
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_ADMIN_EXPORT: "false"
      BYPASS_MODEL_ACCESS_CONTROL: "false"
      ENABLE_ADMIN_CHAT_ACCESS: "false"

      # API per usuari. Cada clau hereta el rol, grups i accés a models
      # de la persona que la genera.
      ENABLE_API_KEYS: "true"
      USER_PERMISSIONS_FEATURES_API_KEYS: "true"
      ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS: "true"
      API_KEYS_ALLOWED_ENDPOINTS: '/api/models,/api/chat/completions,/ollama/api/tags,/ollama/api/chat,/ollama/api/generate,/ollama/api/embed,/ollama/v1/responses'
      CUSTOM_API_KEY_HEADER: X-OpenWebUI-Key

      AIOHTTP_CLIENT_ALLOW_REDIRECTS: "false"
      HOME: /app/backend/data
      HF_HOME: /app/backend/data/cache/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/backend/data/cache/sentence-transformers
      PYTHONPYCACHEPREFIX: /tmp/pycache
    volumes:
      - openwebui_data:/app/backend/data
    networks:
      - ai_backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=2g,mode=1777
    pids_limit: 512
    cpus: ${OPEN_WEBUI_CPUS:-4}
    mem_limit: ${OPEN_WEBUI_MEMORY_LIMIT:-8g}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c "import json,urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5));
          raise SystemExit(0 if data.get('status') is True else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  
  caddy:
    image: caddy:2.11.4-alpine
    platform: linux/arm64
    container_name: dgx-caddy
    restart: unless-stopped
    init: true

    depends_on:
      open-webui:
        condition: service_healthy

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    networks:
      - ai_backend

    security_opt:
      - no-new-privileges:true

networks:
  ai_backend:
    name: dgx_ai_backend
    driver: bridge

volumes:
  ollama_data:
    name: dgx_ollama_data
  openwebui_data:
    name: dgx_openwebui_data
  postgres_data:
    name: dgx_postgres_data

  caddy_data:
    name: dgx_caddy_data

  caddy_config:
    name: dgx_caddy_config
